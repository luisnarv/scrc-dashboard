
<html>

<body>


<label class="flex items-center justify-between p-2 rounded-lg hover:bg-gray-50 cursor-pointer">

<label class="relative inline-flex items-center justify-center cursor-pointer">

    <svg class="w-4 h-4 text-white opacity-0 peer-checked:opacity-100" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
    </svg>
  </span>

      <span class="text-xs bg-blue-100 text-blue-700 font-semibold px-2 py-0.5 rounded-full">2</span>
      <span class="transition group-open:rotate-180">▼</span>
    </span>
  </summary>
  <div class="mt-3 space-y-2 pl-1">
    <!-- Lista de checkboxes regulares aquí -->
  </div>
</details>

<label class="cursor-pointer">
  <input type="checkbox" class="peer sr-only">
  <span class="w-10 h-10 flex items-center justify-center border border-gray-300 rounded-md text-sm font-semibold text-gray-700 
               peer-checked:bg-black peer-checked:text-white peer-checked:border-black transition-all">

  <div class="max-h-40 overflow-y-auto space-y-1.5 pr-1">

      <input type="checkbox" class="rounded text-blue-600"> Apple

    <input type="checkbox" class="peer sr-only">
    <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
